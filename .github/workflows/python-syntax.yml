name: Python syntax check

on:
  push:
    paths:
      - "**.py"
      - ".github/workflows/python-syntax.yml"
  pull_request:
    paths:
      - "**.py"
      - ".github/workflows/python-syntax.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check syntax of lesson scripts
        run: python -m compileall -q sesiones
