name: Python syntax check

on:
  push:
    paths:
      - "**.py"
      - ".github/workflows/python-syntax.yml"
      - "requirements-test.txt"
  pull_request:
    paths:
      - "**.py"
      - ".github/workflows/python-syntax.yml"
      - "requirements-test.txt"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies for functional tests
        run: python -m pip install -r requirements-test.txt
      - name: Check syntax of lessons, projects and tests
        run: python -m compileall -q sesiones proyectos pruebas
      - name: Run unit tests
        run: python -m unittest discover -s pruebas -v
